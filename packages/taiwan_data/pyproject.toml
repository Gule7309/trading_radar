[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taiwan-stock-data"
version = "0.1.0"
description = "Portable SQLite data layer and official-source refreshers for Taiwan stocks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "requests>=2.32,<3",
  "tzdata>=2025.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
bootstrap = ["pyarrow>=15"]
test = ["pytest>=8", "pyarrow>=15"]

[project.scripts]
taiwan-data = "taiwan_data.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
taiwan_data = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

